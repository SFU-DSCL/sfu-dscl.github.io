<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Visualization of Data</title>
  <desc id="desc">A square illustration of dashboards, charts, maps, and decision-ready visual analytics</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061a33"/>
      <stop offset="0.52" stop-color="#0a3158"/>
      <stop offset="1" stop-color="#010b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="40%" r="58%">
      <stop offset="0" stop-color="#39c7ff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#0d5f9f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid{stroke:#3ec7ff;stroke-opacity:.10;stroke-width:1}
      .line{stroke:#74dcff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:url(#softglow)}
      .thin{stroke:#74dcff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.9}
      .red{stroke:#CC0633;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none;filter:url(#softglow)}
      .fill{fill:#0d2f55;stroke:#74dcff;stroke-width:3;filter:url(#softglow)}
      .fill2{fill:#08213f;stroke:#9ee9ff;stroke-width:3}
      .txt{font-family:Inter,Arial,sans-serif;fill:#ffffff;font-weight:800;letter-spacing:.04em}
      .sub{font-family:Inter,Arial,sans-serif;fill:#b9ddf5;font-weight:600;letter-spacing:.02em}
      .node{fill:#ffffff;stroke:#74dcff;stroke-width:4;filter:url(#softglow)}
      .dot{fill:#74dcff;filter:url(#softglow)}
    </style>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="1000" fill="url(#glow)"/>
  <g opacity=".50">
    <path class="grid" d="M100 0V1000 M200 0V1000 M300 0V1000 M400 0V1000 M500 0V1000 M600 0V1000 M700 0V1000 M800 0V1000 M900 0V1000"/>
    <path class="grid" d="M0 100H1000 M0 200H1000 M0 300H1000 M0 400H1000 M0 500H1000 M0 600H1000 M0 700H1000 M0 800H1000 M0 900H1000"/>
  </g>
  <text x="72" y="94" class="txt" font-size="38">SFU DSCL</text>
  <text x="72" y="140" class="sub" font-size="22">Visualization of Data</text>

  <g transform="translate(105 235)">
    <rect class="fill" x="0" y="0" width="790" height="555" rx="32"/>
    <path class="red" d="M0 82H790"/>
    <circle class="dot" cx="48" cy="41" r="10"/><circle class="dot" cx="84" cy="41" r="10"/><circle class="dot" cx="120" cy="41" r="10"/>
    <g transform="translate(50 125)">
      <rect class="fill2" x="0" y="0" width="310" height="185" rx="22"/>
      <path class="thin" d="M42 145H268 M42 145V38"/>
      <path class="red" d="M55 132L105 95L150 112L205 58L255 72"/>
      <text x="98" y="175" class="sub" font-size="19">PERFORMANCE</text>
    </g>
    <g transform="translate(405 125)">
      <rect class="fill2" x="0" y="0" width="330" height="185" rx="22"/>
      <path class="line" d="M55 128C95 75 135 95 160 55C205 103 250 82 280 125"/>
      <circle class="node" cx="55" cy="128" r="9"/><circle class="node" cx="160" cy="55" r="9"/><circle class="node" cx="280" cy="125" r="9"/>
      <text x="92" y="175" class="sub" font-size="19">NETWORK MAP</text>
    </g>
    <g transform="translate(50 350)">
      <rect class="fill2" x="0" y="0" width="685" height="150" rx="22"/>
      <rect x="45" y="78" width="70" height="42" rx="8" fill="#74dcff" opacity=".55"/>
      <rect x="145" y="52" width="70" height="68" rx="8" fill="#74dcff" opacity=".70"/>
      <rect x="245" y="28" width="70" height="92" rx="8" fill="#CC0633" opacity=".85"/>
      <rect x="345" y="62" width="70" height="58" rx="8" fill="#74dcff" opacity=".68"/>
      <rect x="445" y="42" width="70" height="78" rx="8" fill="#74dcff" opacity=".78"/>
      <rect x="545" y="18" width="70" height="102" rx="8" fill="#74dcff" opacity=".92"/>
      <text x="245" y="140" class="sub" font-size="19">DECISION DASHBOARD</text>
    </g>
  </g>
</svg>
